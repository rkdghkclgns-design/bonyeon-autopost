name: 청소 자동 포스팅
# Actions 실행 목록에 무엇을 실행했는지 표시 (예: "💬 슬랙 포스팅 · 정기청소 [테스트]")
run-name: >-
  ${{ github.event_name == 'schedule' && (vars.AUTO_PUBLISH == 'true' && '⏰ 정기 자동 포스팅' || '⏰ 정기 미리보기 [검토용]') || format('{0} {1}{2}{3}',
  (inputs.source == 'slack' || github.event_name == 'repository_dispatch') && '💬 슬랙' || '🖐 수동',
  (inputs.mode == 'setup' || github.event.action == 'slack-setup') && '초기 세팅' || '포스팅',
  (inputs.category || github.event.client_payload.category) && format(' · {0}', inputs.category || github.event.client_payload.category) || '',
  (inputs.dry_run || github.event.client_payload.dry_run) && ' [테스트]' || '') }}

on:
  schedule:
    # 평일 10:17 (KST) = UTC 01:17. 정각은 GitHub 부하로 지연이 잦아 17분으로 설정
    - cron: "17 1 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [post, setup]
        default: post
      category:
        description: "카테고리 (비우면 사진이 가장 많은 카테고리: 정기청소 / 로프청소 / 방역소독)"
        type: string
        default: ""
      location:
        description: "실제 현장 위치 (예: 고잔동, 안산 중앙동). 비우면 서비스 지역 동을 순환"
        type: string
        default: ""
      dry_run:
        description: "테스트 실행 (발행·사진이동 없이 슬랙으로 미리보기)"
        type: boolean
        default: false
      source:
        description: "실행 경로 (슬랙 명령은 slack — 자동 입력)"
        type: string
        default: ""
      requested_by:
        description: "요청자 (슬랙 명령 시 자동 입력)"
        type: string
        default: ""
  repository_dispatch:
    # (이전 방식 호환) 현재 슬랙 중계는 workflow_dispatch API 를 사용
    types: [slack-post, slack-setup]

concurrency:
  group: auto-post
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 일반 설정 (Settings > Secrets and variables > Actions > Variables)
      COMPANY_NAME: ${{ vars.COMPANY_NAME }}
      COMPANY_PHONE: ${{ vars.COMPANY_PHONE }}
      SERVICE_AREA: ${{ vars.SERVICE_AREA }}
      DRIVE_ROOT_FOLDER_NAME: ${{ vars.DRIVE_ROOT_FOLDER_NAME }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
      NAVER_PUBLISH_MODE: ${{ vars.NAVER_PUBLISH_MODE }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL }}
      PHOTOS_PER_STAGE: ${{ vars.PHOTOS_PER_STAGE }}
      REVIEWS_PER_POST: ${{ vars.REVIEWS_PER_POST }}
      MIN_PHOTOS: ${{ vars.MIN_PHOTOS }}
      VIDEO_SECONDS: ${{ vars.VIDEO_SECONDS }}
      OUTPUT_DIR: output
      # 시크릿 (Settings > Secrets and variables > Actions > Secrets)
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # 진행 단계별 결과물 채널 ID (Variables, 비우면 알림 채널의 진행 메시지 스레드로)
      SLACK_CHANNEL_PHOTOS: ${{ vars.SLACK_CHANNEL_PHOTOS }}
      SLACK_CHANNEL_DRAFT: ${{ vars.SLACK_CHANNEL_DRAFT }}
      SLACK_CHANNEL_VIDEO: ${{ vars.SLACK_CHANNEL_VIDEO }}
      SLACK_CHANNEL_PUBLISH: ${{ vars.SLACK_CHANNEL_PUBLISH }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
      NAVER_STORAGE_STATE_B64: ${{ secrets.NAVER_STORAGE_STATE_B64 }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      # (선택) 갱신된 네이버 세션/틱톡 토큰을 시크릿에 자동 저장할 PAT (Secrets: Read and write)
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      HAS_NAVER: ${{ secrets.NAVER_STORAGE_STATE_B64 != '' && secrets.NAVER_BLOG_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 네이버용 브라우저 설치
        if: env.HAS_NAVER == 'true'
        run: python -m playwright install --with-deps chromium

      - name: 자동화 실행
        id: autopost
        env:
          # 외부 입력(inputs/client_payload)은 run 스크립트에 직접 넣지 않고 환경변수로만 전달 (스크립트 인젝션 방지)
          AUTOPOST_MODE: ${{ (github.event_name == 'repository_dispatch' && github.event.action == 'slack-setup') && 'setup' || inputs.mode || 'post' }}
          AUTOPOST_CATEGORY: ${{ github.event.client_payload.category || inputs.category || '' }}
          AUTOPOST_LOCATION: ${{ inputs.location || '' }}
          # 정기 자동 실행은 기본적으로 '검토용 미리보기'(발행 안 함). 자동 발행하려면 Variable AUTO_PUBLISH=true
          AUTOPOST_DRY_RUN: ${{ (github.event_name == 'schedule' && vars.AUTO_PUBLISH != 'true') || inputs.dry_run || github.event.client_payload.dry_run || false }}
          AUTOPOST_TRIGGER: ${{ inputs.source || github.event_name }}
          AUTOPOST_REQUESTED_BY: ${{ inputs.requested_by || github.event.client_payload.requested_by || github.actor }}
          AUTOPOST_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python main.py

      - name: 실패 알림 (파이썬 실행 전 준비 단계 오류)
        # 파이썬 단계 자체의 오류는 슬랙 진행 스레드로 이미 보고되므로 중복 알림하지 않음
        if: failure() && steps.autopost.outcome != 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚨 [청소 자동화] GitHub Actions 준비 단계에서 실패했습니다 (패키지 설치 등). 로그: ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: 오류 진단 자료 보관 (실패 시에만, 3일)
        # 정상 실행의 결과물(사진·원고·영상)은 슬랙 진행 스레드에 올라가므로 실패했을 때만 보관한다.
        # 계정의 Artifacts 저장 용량이 가득 차도 전체 실행이 실패로 표시되지 않게 한다.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: autopost-output-${{ github.run_id }}
          path: output/
          retention-days: 3
          if-no-files-found: ignore
