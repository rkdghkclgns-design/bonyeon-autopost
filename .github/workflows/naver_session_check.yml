name: 네이버 로그인 점검

# GitHub(해외 서버)에서 저장된 네이버 로그인으로 글쓰기 화면이 열리는지만 확인한다.
# 글을 쓰거나 저장하지 않는다. 로그인이 유지되면 갱신된 로그인 정보를 시크릿에 저장한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: 네이버 글쓰기 화면 열기 (입력·저장 없음)
        env:
          NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
          NAVER_STORAGE_STATE_B64: ${{ secrets.NAVER_STORAGE_STATE_B64 }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python scripts/naver_session_check.py
